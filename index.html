<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fogo 批量查询</title>
<style>
  :root{
    --bg:#f7f8fb; --paper:#fff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --ok:#16a34a; --err:#dc2626; --warn:#b45309;
    --radius:12px; --shadow:0 8px 28px rgba(0,0,0,.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55}
  .wrap{max-width:980px;margin:32px auto;padding:0 16px}
  h1{margin:0 0 16px;font-size:20px;font-weight:800}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
  textarea{
    width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;resize:vertical;
    padding:10px;background:#fff;font-family:var(--mono);font-size:13px
  }
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--brand);color:#fff;
    padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.secondary{background:#6b7280}
  .btn.ghost{background:#fff;color:#1f2937}
  .btn.link{background:#eef2ff;color:#1d4ed8;border-color:#dbe3ff}
  .btn[disabled]{opacity:.6;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px}
  .summary{margin-top:10px}
  .summary b{font-weight:800}
  table{width:100%;border-collapse:collapse}
  thead th{background:#fafafa;border-bottom:1px solid var(--line);text-align:left;padding:10px;font-size:13px;color:#374151}
  thead th.sortable{cursor:pointer;user-select:none}
  tbody td{border-bottom:1px solid var(--line);padding:10px;font-size:14px;vertical-align:top}
  tbody tr:nth-child(odd){background:#fcfcfd}
  .addr{font-family:var(--mono);word-break:break-all}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .status{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center}
  .ok{background:#e8f7ee;border:1px solid #bfe8cb;color:var(--ok)}
  .err{background:#fdeaea;border:1px solid #f3c3c3;color:var(--err)}
  .pending{background:#eef2ff;border:1px solid #dbe3ff;color:#4f46e5}
  .warn{background:#fff7ed;border:1px solid #fde68a;color:var(--warn)}
  .text-err{color:var(--err);font-weight:700}
  .num-err{color:var(--err)}
  .blur{filter: blur(6px)}
  .small{font-size:12px}
  .select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px}
  .field{
    display:flex;align-items:center;gap:8px;
    padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff
  }
  .field label{font-size:12px;color:#374151}
  .field input{
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;
    font-family:var(--mono);background:#fff;width:110px
  }
  .pill{
    display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
    background:#fafafa;font-size:12px;color:#374151
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fogo 批量查询</h1>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <a href="https://claim.fogo.io/" target="_blank" rel="noopener" class="btn link">官方查询入口传送门</a>
      <a href="https://x.com/0xXIAOc" target="_blank" rel="noopener" class="btn link">作者推特 @0xXIAOc</a>
      <span class="pill">自动识别 EVM/SVM · EVM 自动小写 · 每批 10 个</span>
    </div>

    <div class="row" style="width:100%">
      <div style="flex:1">
        <label for="addrs" class="hint">钱包地址（每行一个，支持 EVM 0x… 与 SVM Base58，自动识别）</label>
        <textarea id="addrs" placeholder="0x9ed15383940cc380faef0a75edace507cc775f22&#10;Gmm2PTX48kzNAMWjv13uvaJwHG8XoX3jJubzGhLMJPBx"></textarea>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="start" class="btn">开始查询</button>
      <button id="stop" class="btn secondary" disabled>停止</button>
    </div>

    <div class="row" style="margin-top:10px">
      <div class="field">
        <label for="decimals">Decimals</label>
        <input id="decimals" type="number" min="0" max="18" step="1" value="9"/>
      </div>

      <div class="field">
        <label for="symbol">Symbol</label>
        <input id="symbol" type="text" value="FOGO"/>
      </div>

      <label class="hint"><input id="showRaw" type="checkbox"> 显示原始值</label>
    </div>

    <div class="row" style="margin-top:10px">
      <label class="hint"><input id="onlyOk" type="checkbox"> 只看有额度的</label>
      <label class="hint"><input id="hideAddr" type="checkbox"> 隐藏地址</label>

      <span class="hint">导出选项：</span>
      <label class="hint"><input id="exportOnlyOk" type="checkbox" checked> 仅导出有额度</label>
      <button id="btnCsv" class="btn ghost" disabled>导出 CSV</button>

      <span class="hint">复制有额度地址：</span>
      <select id="sepSel" class="select small">
        <option value="nl">换行分隔</option>
        <option value="comma">逗号分隔</option>
      </select>
      <button id="btnCopy" class="btn ghost" disabled>复制</button>
    </div>

    <div id="summary" class="summary">
      输入地址数量 <b>0</b> 个 · 已完成 <b>0</b> 个 · 有额度 <b>0</b> 个 · 总分配 <b>0</b> FOGO
    </div>
  </div>

  <div class="card" id="tableCard" style="margin-top:16px;display:none">
    <table>
      <thead>
        <tr>
          <th style="width:60px">#</th>
          <th>地址</th>
          <th id="thAmount" class="num sortable" style="width:220px">总分配</th>
          <th style="width:140px">状态</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
  // ✅ 同源代理（Vercel Functions）
  const API_ENDPOINT = "/api/allocations";

  // ✅ 固定每批并发 10 个
  const BATCH_SIZE = 10;

  const ETH_RE_ANY = /^0x[a-fA-F0-9]{40}$/;
  const SVM_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

  const $ = s => document.querySelector(s);

  const addrsEl = $('#addrs'), startBtn = $('#start'), stopBtn = $('#stop');
  const tbody = $('#tbody'), tableCard = $('#tableCard'), summary = $('#summary');
  const thAmount = $('#thAmount');

  const onlyOkEl = $('#onlyOk'), hideAddrEl = $('#hideAddr');
  const btnCsv = $('#btnCsv'), exportOnlyOkEl = $('#exportOnlyOk');
  const btnCopy = $('#btnCopy'), sepSel = $('#sepSel');

  const decimalsEl = $('#decimals');
  const symbolEl = $('#symbol');
  const showRawEl = $('#showRaw');

  let aborter = null;
  let rows = [];
  let results = []; // { address, identityType, eligible, totalRaw(BigInt), allocations[], status }
  let sortAmountAsc = null;

  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  function parseAddresses(text){
    return text.replace(/\r/g,'\n')
      .split(/[\s,;]+/)
      .map(s=>s.trim())
      .filter(Boolean);
  }

  // ✅ 自动识别：返回 {identityType, addressNormalized} 或 null
  function detectAndNormalize(raw){
    raw = (raw || '').trim();
    if (!raw) return null;

    if (ETH_RE_ANY.test(raw)) {
      return { identityType: 'evm_wallet', address: raw.toLowerCase() }; // ✅ EVM 自动小写
    }
    if (SVM_RE.test(raw)) {
      return { identityType: 'svm_wallet', address: raw };
    }
    return null;
  }

  function getDecimals(){
    const v = parseInt(decimalsEl.value, 10);
    return clamp(Number.isFinite(v) ? v : 9, 0, 18);
  }
  function getSymbol(){
    return (symbolEl.value || 'FOGO').trim() || 'FOGO';
  }
  function showRaw(){ return !!showRawEl.checked; }

  function setBusy(b){
    startBtn.disabled = b;
    stopBtn.disabled = !b;
  }

  function updateAmountHeader(){
    let label = '总分配';
    if (sortAmountAsc === true) label += ' ▲';
    else if (sortAmountAsc === false) label += ' ▼';
    thAmount.textContent = label;
    thAmount.classList.add('sortable');
  }

  function safeBigInt(s){
    try{
      if (typeof s !== 'string') s = String(s ?? '0');
      if (!/^\d+$/.test(s)) return 0n;
      return BigInt(s);
    }catch{
      return 0n;
    }
  }

  function formatUnits(raw, decimals){
    raw = (typeof raw === 'bigint') ? raw : safeBigInt(raw);
    decimals = clamp(decimals|0, 0, 18);

    const neg = raw < 0n;
    const x = neg ? -raw : raw;

    if (decimals === 0) return (neg ? '-' : '') + x.toString();

    const base = 10n ** BigInt(decimals);
    const intPart = x / base;
    const fracPart = x % base;

    let frac = fracPart.toString().padStart(decimals, '0');
    frac = frac.replace(/0+$/,'');
    const out = frac.length ? `${intPart.toString()}.${frac}` : intPart.toString();
    return (neg ? '-' : '') + out;
  }

  function renderAmount(rawBig){
    if (showRaw()) return (typeof rawBig === 'bigint' ? rawBig : safeBigInt(rawBig)).toString();
    return formatUnits(rawBig, getDecimals());
  }

  function buildAllocTooltip(allocs){
    if (!Array.isArray(allocs) || allocs.length === 0) return '';
    const dec = getDecimals();
    const sym = getSymbol();
    return allocs.map(a=>{
      const raw = a.amountRaw ?? 0n;
      const f = formatUnits(raw, dec);
      return `${a.category || 'Unknown'}: ${showRaw() ? raw.toString() : (f + ' ' + sym)} (raw: ${raw.toString()})`;
    }).join('\n');
  }

  function setSummaryFromResults(){
    const total = results.length;
    const done = results.filter(r => r && r.status !== 'queued' && r.status !== 'running').length;
    const eligible = results.filter(r => r && r.eligible === true).length;

    let sumRaw = 0n;
    for (const r of results){
      if (r && r.eligible === true && typeof r.totalRaw === 'bigint') sumRaw += r.totalRaw;
    }

    summary.innerHTML =
      `输入地址数量 <b>${total}</b> 个 · 已完成 <b>${done}</b> 个 · 有额度 <b>${eligible}</b> 个 · 总分配 <b>${renderAmount(sumRaw)}</b> ${getSymbol()}`;
  }

  function addRow(idx, address){
    const tr = document.createElement('tr');

    const tdIdx = document.createElement('td');
    tdIdx.textContent = String(idx + 1);

    const tdAddr = document.createElement('td');
    tdAddr.className = 'addr';
    tdAddr.textContent = address;

    const tdAmt = document.createElement('td');
    tdAmt.className = 'num';
    tdAmt.textContent = '—';

    const tdStat = document.createElement('td');
    tdStat.className = 'status';
    tdStat.innerHTML = `<span class="dot warn">•</span><span> 排队中</span>`;

    tr.appendChild(tdIdx);
    tr.appendChild(tdAddr);
    tr.appendChild(tdAmt);
    tr.appendChild(tdStat);
    tbody.appendChild(tr);

    return {
      tr, idxCell: tdIdx, addrEl: tdAddr, amtEl: tdAmt, statEl: tdStat,
      setPending(){ this.statEl.innerHTML = `<span class="dot pending">…</span><span class="muted"> 查询中</span>`; },
      setOK(totalRaw, allocations){
        this.amtEl.classList.remove('num-err');
        this.amtEl.textContent = renderAmount(totalRaw);
        this.amtEl.title = buildAllocTooltip(allocations); // 功能保留，但不显示提示文案
        this.statEl.innerHTML = `<span class="dot ok">✔</span><span> 有额度</span>`;
      },
      setNo(){
        this.amtEl.classList.remove('num-err');
        this.amtEl.textContent = renderAmount(0n);
        this.amtEl.title = '';
        this.statEl.innerHTML = `<span class="dot err">✖</span><span> 无额度</span>`;
      },
      setFail(msg='失败'){
        this.amtEl.classList.add('num-err');
        this.amtEl.textContent = renderAmount(0n);
        this.amtEl.title = msg || '';
        this.statEl.innerHTML = `<span class="dot err">✖</span><span class="text-err" title="${String(msg).replace(/"/g,'&quot;')}"> 失败</span>`;
      },
      setStop(){
        this.statEl.innerHTML = `<span class="dot err">✖</span><span class="text-err"> 已停止</span>`;
      }
    };
  }

  async function fetchOnce(identity, identityType, signal){
    const url = new URL(API_ENDPOINT, window.location.origin);
    url.searchParams.set('identity', identity);
    url.searchParams.set('identityType', identityType);

    const res = await fetch(url.toString(), {
      method:'GET',
      headers:{ 'accept':'application/json' },
      cache:'no-store',
      signal
    });

    const text = await res.text();

    const is1015 = text.includes('Error 1015') || text.includes('You are being rate limited');
    if (res.status === 429 || is1015) throw new Error(is1015 ? 'CF_1015' : 'HTTP_429');
    if (!res.ok) throw new Error(`HTTP_${res.status}`);

    let json;
    try{ json = JSON.parse(text); }
    catch{ throw new Error('JSON_PARSE_ERROR'); }

    const totalRaw = safeBigInt(json?.totalAmount ?? '0');
    const allocations = Array.isArray(json?.allocations)
      ? json.allocations.map(a => ({
          category: String(a?.category ?? ''),
          amountRaw: safeBigInt(a?.amount ?? '0')
        }))
      : [];

    return { eligible: totalRaw > 0n, totalRaw, allocations };
  }

  function updateExportButtons(){
    const anyDone = results.some(r => r && r.status !== 'queued');
    const anyOk = results.some(r => r && r.eligible === true);
    btnCsv.disabled = !anyDone;
    btnCopy.disabled = !anyOk;
  }

  function applyView(){
    const onlyOk = onlyOkEl.checked;

    let idxs = results.map((_,i)=> i);
    if (onlyOk) idxs = idxs.filter(i => results[i]?.eligible === true);

    if (sortAmountAsc !== null){
      idxs.sort((a,b)=>{
        const ra = results[a]?.totalRaw ?? 0n;
        const rb = results[b]?.totalRaw ?? 0n;
        return ra === rb ? 0 : (ra < rb ? -1 : 1);
      });
      if (sortAmountAsc === false) idxs.reverse();
    }

    rows.forEach(r => r.tr.style.display = 'none');
    idxs.forEach((i, orderIdx)=>{
      const r = rows[i];
      r.tr.style.display = '';
      r.idxCell.textContent = String(orderIdx + 1);
      tbody.appendChild(r.tr);
    });

    rows.forEach(r => r.addrEl.classList.toggle('blur', hideAddrEl.checked));

    // 重绘金额（decimals/showRaw/symbol 变化）
    for (let i=0;i<results.length;i++){
      const r = results[i];
      if (!r) continue;
      if (r.status === 'OK'){
        rows[i].amtEl.textContent = renderAmount(r.totalRaw);
        rows[i].amtEl.title = buildAllocTooltip(r.allocations);
      }else if (r.status === 'NO'){
        rows[i].amtEl.textContent = renderAmount(0n);
        rows[i].amtEl.title = '';
      }else if (r.status === 'FAIL' || r.status === 'STOP'){
        rows[i].amtEl.textContent = renderAmount(0n);
      }
    }

    updateExportButtons();
    updateAmountHeader();
    setSummaryFromResults();
  }

  function collectForExport(onlyOk){
    const dec = getDecimals();
    const sym = getSymbol();

    const out = results.map((r,i)=>{
      if (!r) return null;
      const alloc = Array.isArray(r.allocations) ? r.allocations : [];
      const allocSimple = alloc.map(a => ({
        category: a.category,
        amount_raw: (a.amountRaw ?? 0n).toString(),
        amount_fmt: formatUnits(a.amountRaw ?? 0n, dec)
      }));
      return {
        index: i + 1,
        address: r.address,
        identityType: r.identityType,
        eligible: !!r.eligible,
        status: r.status,
        total_raw: (r.totalRaw ?? 0n).toString(),
        total_fmt: formatUnits(r.totalRaw ?? 0n, dec),
        symbol: sym,
        allocations: JSON.stringify(allocSimple)
      };
    }).filter(Boolean);

    return onlyOk ? out.filter(x => x.eligible) : out;
  }

  function toCsv(rows){
    const headers = ['index','address','identityType','eligible','status','total_raw','total_fmt','symbol','allocations'];
    const esc = v => {
      v = (v == null) ? '' : String(v);
      return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
    };
    return [headers.join(','), ...rows.map(r => headers.map(h => esc(r[h])).join(','))].join('\n');
  }

  function chunkIndices(len, size){
    const out = [];
    for (let i=0;i<len;i+=size){
      const idxs = [];
      for (let k=0;k<size && (i+k)<len;k++) idxs.push(i+k);
      out.push(idxs);
    }
    return out;
  }

  async function runBatch(indices){
    const controllers = indices.map(()=> new AbortController());
    const onAbort = () => controllers.forEach(c => c.abort());
    aborter.signal.addEventListener('abort', onAbort, { once:true });

    indices.forEach(i => {
      rows[i].setPending();
      results[i].status = 'running';
    });

    const settled = await Promise.all(indices.map((i, k) =>
      fetchOnce(results[i].address, results[i].identityType, controllers[k].signal)
        .then(r => ({ ok:true, res:r, i }))
        .catch(e => ({ ok:false, err:e, i }))
    ));

    for (const s of settled){
      if (aborter.signal.aborted) continue;

      if (s.ok){
        if (s.res.eligible){
          rows[s.i].setOK(s.res.totalRaw, s.res.allocations);
          results[s.i] = { ...results[s.i], eligible:true, totalRaw:s.res.totalRaw, allocations:s.res.allocations, status:'OK' };
        }else{
          rows[s.i].setNo();
          results[s.i] = { ...results[s.i], eligible:false, totalRaw:0n, allocations:s.res.allocations, status:'NO' };
        }
      }else{
        rows[s.i].setFail(s.err?.message || '失败');
        results[s.i] = { ...results[s.i], eligible:false, totalRaw:0n, allocations:[], status:'FAIL' };
      }
    }

    applyView();
  }

  async function runAll(){
    const groups = chunkIndices(results.length, BATCH_SIZE);
    for (let g=0; g<groups.length; g++){
      if (aborter.signal.aborted) break;
      await runBatch(groups[g]); // ✅ 本批出结果后，立刻下一批
    }
  }

  function resetUI(){
    tbody.innerHTML = '';
    tableCard.style.display = 'none';
    rows = [];
    results = [];
    sortAmountAsc = null;
    updateAmountHeader();
    btnCsv.disabled = true;
    btnCopy.disabled = true;
    setSummaryFromResults();
  }

  // ===== 事件 =====
  startBtn.addEventListener('click', async ()=>{
    resetUI();

    const rawList = parseAddresses(addrsEl.value);

    const list = [];
    const seen = new Set();

    for (const raw of rawList){
      const hit = detectAndNormalize(raw);
      if (!hit) continue;

      const key = `${hit.identityType}:${hit.address}`;
      if (seen.has(key)) continue;
      seen.add(key);

      list.push(hit);
    }

    if (list.length === 0){
      alert('请粘贴至少一个有效地址（EVM 0x… 或 SVM Base58）');
      return;
    }

    tableCard.style.display = 'block';

    list.forEach((it, i)=>{
      rows.push(addRow(i, it.address));
      results.push({
        address: it.address,
        identityType: it.identityType,
        eligible: null,
        totalRaw: 0n,
        allocations: [],
        status: 'queued'
      });
    });

    applyView();

    aborter = new AbortController();
    setBusy(true);

    try{
      await runAll();
    }catch(e){
      if (e?.name !== 'AbortError') console.error(e);
    }finally{
      setBusy(false);
      applyView();
    }
  });

  stopBtn.addEventListener('click', ()=>{
    if (aborter) aborter.abort();

    for (let i=0;i<results.length;i++){
      const r = results[i];
      if (!r) continue;
      if (r.status === 'queued' || r.status === 'running'){
        rows[i].setStop();
        results[i].status = 'STOP';
      }
    }
    applyView();
  });

  onlyOkEl.addEventListener('change', applyView);
  hideAddrEl.addEventListener('change', applyView);
  showRawEl.addEventListener('change', applyView);
  decimalsEl.addEventListener('change', applyView);
  symbolEl.addEventListener('input', applyView);

  thAmount.addEventListener('click', ()=>{
    sortAmountAsc = (sortAmountAsc === null) ? false : !sortAmountAsc;
    applyView();
  });

  btnCsv.addEventListener('click', ()=>{
    const data = collectForExport(exportOnlyOkEl.checked);
    if (data.length === 0) return;

    const csv = toCsv(data);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: 'fogo_allocations_results.csv'
    });
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });

  btnCopy.addEventListener('click', async ()=>{
    const okAddrs = results.filter(r => r && r.eligible === true).map(r => r.address);
    if (okAddrs.length === 0){
      alert('没有“有额度”的地址');
      return;
    }
    const sep = (sepSel.value === 'comma') ? ',' : '\n';
    const text = okAddrs.join(sep);

    try{
      await navigator.clipboard.writeText(text);
      alert(`已复制 ${okAddrs.length} 个有额度地址`);
    }catch{
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert(`已复制 ${okAddrs.length} 个有额度地址`);
    }
  });

  updateAmountHeader();

  // 默认塞两个示例（你可删）
  addrsEl.value =
    "0x9ed15383940cc380faef0a75edace507cc775f22\n" +
    "Gmm2PTX48kzNAMWjv13uvaJwHG8XoX3jJubzGhLMJPBx";
</script>
</body>
</html>
