<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fogo 空投批量查询</title>

<style>
  :root{
    --bg:#f7f8fb;
    --paper:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e5e7eb;

    --brand:#2563eb;
    --brand2:#1d4ed8;

    --ok:#16a34a;
    --err:#dc2626;
    --warn:#b45309;

    --radius:14px;
    --shadow:0 10px 34px rgba(15,23,42,.08);
    --shadow-soft:0 6px 18px rgba(15,23,42,.08);

    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;

    --ring: 0 0 0 4px rgba(37,99,235,.18);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:var(--font);
    line-height:1.55;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 18% -10%, rgba(238,242,255,1) 0%, rgba(238,242,255,0) 60%),
      radial-gradient(900px 520px at 92% 6%, rgba(236,254,255,1) 0%, rgba(236,254,255,0) 55%),
      var(--bg);
  }

  .wrap{
    max-width:980px;
    margin:28px auto;
    padding:0 16px;
  }

  h1{
    margin:0 0 14px;
    font-size:20px;
    font-weight:800;
    letter-spacing:.2px;
  }

  .card{
    background:var(--paper);
    border:1px solid rgba(226,232,240,.9);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }

  .row{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }

  textarea{
    width:100%;
    min-height:176px;
    border:1px solid #dbe3f0;
    border-radius:12px;
    resize:vertical;
    padding:12px 12px;
    background:#fbfcff;
    font-family:var(--mono);
    font-size:13px;
    line-height:1.55;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  textarea::placeholder{color:#9ca3af}
  textarea:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:var(--ring);
    background:#ffffff;
  }

  .btn{
    appearance:none;
    border:1px solid transparent;
    background:var(--brand);
    color:#fff;

    padding:10px 16px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;

    box-shadow: 0 1px 0 rgba(15,23,42,.06);
    transition: transform .06s ease, box-shadow .15s ease, filter .15s ease, background .15s ease, border-color .15s ease;
    user-select:none;
  }
  .btn:hover{
    filter: brightness(1.03);
    box-shadow:var(--shadow-soft);
  }
  .btn:active{
    transform: translateY(1px);
    box-shadow: 0 4px 12px rgba(15,23,42,.10);
  }

  .btn.secondary{background:#64748b}
  .btn.secondary:hover{ filter: brightness(1.02); }

  .btn.ghost{
    background:#ffffff;
    color:#0f172a;
    border-color:#e2e8f0;
    box-shadow:none;
  }
  .btn.ghost:hover{
    background:#f8fafc;
    box-shadow: 0 6px 14px rgba(15,23,42,.08);
  }

  .btn.link{
    background:#eef2ff;
    color:var(--brand2);
    border-color:#dbe3ff;
    box-shadow:none;
  }
  .btn.link:hover{
    background:#e0e7ff;
    box-shadow: 0 6px 14px rgba(15,23,42,.08);
  }

  .btn[disabled]{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
    filter:none;
  }

  /* ✅ 查询中：开始按钮 disabled 时显示小转圈（不改任何功能逻辑） */
  #start:disabled{
    position:relative;
    padding-right:40px;
  }
  #start:disabled::after{
    content:"";
    position:absolute;
    right:14px;
    width:14px;height:14px;
    border-radius:999px;
    border:2px solid rgba(255,255,255,.55);
    border-top-color: rgba(255,255,255,1);
    animation: spin .8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 焦点可见（键盘 tab） */
  .btn:focus-visible,
  a.btn:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  input:focus-visible{
    outline:none;
    box-shadow:var(--ring);
  }

  .hint{
    color:var(--muted);
    font-size:12px;
  }

  .summary{
    margin-top:12px;
    padding:10px 12px;
    border-radius:12px;
    border:1px dashed #dbe3ff;
    background: linear-gradient(180deg, rgba(248,250,252,1), rgba(248,250,252,.6));
    color:#334155;
  }
  .summary b{
    font-weight:900;
    color:#0f172a;
  }

  .select{
    border:1px solid #e2e8f0;
    border-radius:10px;
    background:#fff;
    padding:8px 10px;
  }

  table{width:100%;border-collapse:separate;border-spacing:0}

  /* ✅ 让表格支持横向滚动，同时不影响 sticky 表头 */
  .tableWrap{
    overflow-x:auto;
    border-radius:var(--radius);
  }

  thead th{
    background: rgba(250,250,250,.96);
    border-bottom:1px solid #eaeef5;
    text-align:left;
    padding:12px 12px;
    font-size:13px;
    color:#334155;

    /* ✅ sticky 表头 */
    position: sticky;
    top: 0;
    z-index: 3;
    backdrop-filter: blur(6px);
  }

  /* sticky 时加一条更清晰的阴影分隔 */
  thead th::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:1px;
    background:#eaeef5;
  }

  thead th.sortable{
    cursor:pointer;
    user-select:none;
  }
  thead th.sortable:hover{
    background:#f3f4f6;
  }

  tbody td{
    border-bottom:1px solid #eef2f7;
    padding:12px 12px;
    font-size:14px;
    vertical-align:top;
  }
  tbody tr:nth-child(odd){background:#fcfcfd}
  tbody tr:hover{background:#f1f5ff}

  .addr{
    font-family:var(--mono);
    word-break:break-all;
  }

  .num{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
    color:#334155;
  }

  .dot{
    width:18px;height:18px;
    border-radius:6px;
    display:inline-grid;
    place-items:center;
    font-size:12px;
    line-height:1;
  }
  .ok{background:#e8f7ee;border:1px solid #bfe8cb;color:var(--ok)}
  .err{background:#fdeaea;border:1px solid #f3c3c3;color:var(--err)}
  .pending{background:#eef2ff;border:1px solid #dbe3ff;color:#4f46e5}
  .warn{background:#fff7ed;border:1px solid #fde68a;color:var(--warn)}

  /* ✅ 查询中 pending 的轻微脉冲动效 */
  .dot.pending{
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.08); }
  }

  .text-err{color:var(--err);font-weight:800}
  .num-err{color:var(--err)}

  /* 表格地址：仍用 blur */
  .blur{filter: blur(6px)}

  /* ✅ 输入框地址隐藏：不模糊边框，只“遮住文字” */
  textarea.blur{
    filter:none;
    color:transparent;
    text-shadow:0 0 12px rgba(15,23,42,.38);
    caret-color:transparent;
  }

  .small{font-size:12px}

  .pill{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid #e2e8f0;
    background:#f8fafc;
    font-size:12px;
    color:#334155;
  }
  .pill:empty{display:none} /* ✅ 空内容就隐藏 */

  @media (max-width: 640px){
    .wrap{margin:16px auto}
    h1{font-size:18px;margin-bottom:12px}
    .card{padding:14px}
    textarea{min-height:160px}
    .btn{padding:10px 14px;border-radius:12px}
    thead th, tbody td{padding:10px 10px}
  }
</style>
</head>

<body>
<div class="wrap">
  <h1>Fogo 空投批量查询</h1>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <a href="https://claim.fogo.io/" target="_blank" rel="noopener" class="btn link">官方查询入口传送门</a>
      <a href="https://x.com/0xXIAOc" target="_blank" rel="noopener" class="btn link">作者推特 @0xXIAOc</a>
      <span class="pill"></span>
    </div>

    <div class="row" style="width:100%">
      <div style="flex:1">
        <label for="addrs" class="hint">钱包地址（每行一个）</label>
        <textarea id="addrs" placeholder="&#10;"></textarea>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <button id="start" class="btn">开始查询</button>
      <button id="stop" class="btn secondary" disabled>停止</button>
    </div>

    <!-- ✅ 已删除：Decimals / Symbol / 显示原始值 那一行 -->

    <div class="row" style="margin-top:10px">
      <label class="hint"><input id="onlyOk" type="checkbox"> 只看有资格的</label>
      <label class="hint"><input id="hideAddr" type="checkbox"> 隐藏地址</label>

      <span class="hint">导出选项：</span>
      <label class="hint"><input id="exportOnlyOk" type="checkbox" checked> 仅导出有资格</label>
      <button id="btnCsv" class="btn ghost" disabled>导出 CSV</button>

      <span class="hint">复制有资格地址：</span>
      <select id="sepSel" class="select small">
        <option value="nl">换行分隔</option>
        <option value="comma">逗号分隔</option>
      </select>
      <button id="btnCopy" class="btn ghost" disabled>复制</button>
    </div>

    <div id="summary" class="summary">
      输入地址数量 <b>0</b> 个 · 已完成 <b>0</b> 个 · 有资格 <b>0</b> 个 · 总分配 <b>0</b> FOGO
    </div>
  </div>

  <div class="card" id="tableCard" style="margin-top:16px;display:none">
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px">#</th>
            <th>地址</th>
            <th id="thAmount" class="num sortable" style="width:220px">总分配</th>
            <th style="width:140px">状态</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ✅ 同源代理（Vercel Functions）
  const API_ENDPOINT = "/api/allocations";

  // ✅ 固定每批并发 10 个
  const BATCH_SIZE = 10;

  // ✅ 默认参数（因为你删掉了输入框）
  const DEFAULT_DECIMALS = 9;
  const DEFAULT_SYMBOL = "FOGO";
  const DEFAULT_SHOW_RAW = false;

  const ETH_RE_ANY = /^0x[a-fA-F0-9]{40}$/;
  const SVM_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

  const $ = s => document.querySelector(s);

  const addrsEl = $('#addrs'), startBtn = $('#start'), stopBtn = $('#stop');
  const tbody = $('#tbody'), tableCard = $('#tableCard'), summary = $('#summary');
  const thAmount = $('#thAmount');

  const onlyOkEl = $('#onlyOk'), hideAddrEl = $('#hideAddr');
  const btnCsv = $('#btnCsv'), exportOnlyOkEl = $('#exportOnlyOk');
  const btnCopy = $('#btnCopy'), sepSel = $('#sepSel');

  // ✅ 这些元素已从页面删除：这里保留引用为 null，并在函数里做兜底
  const decimalsEl = $('#decimals'); // null
  const symbolEl = $('#symbol');     // null
  const showRawEl = $('#showRaw');   // null

  let aborter = null;
  let rows = [];
  let results = []; // { address, identityType, eligible, totalRaw(BigInt), allocations[], status }
  let sortAmountAsc = null;

  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  function parseAddresses(text){
    return text.replace(/\r/g,'\n')
      .split(/[\s,;]+/)
      .map(s=>s.trim())
      .filter(Boolean);
  }

  // ✅ 自动识别：返回 {identityType, addressNormalized} 或 null
  function detectAndNormalize(raw){
    raw = (raw || '').trim();
    if (!raw) return null;

    if (ETH_RE_ANY.test(raw)) {
      return { identityType: 'evm_wallet', address: raw.toLowerCase() }; // ✅ EVM 自动小写
    }
    if (SVM_RE.test(raw)) {
      return { identityType: 'svm_wallet', address: raw };
    }
    return null;
  }

  function getDecimals(){
    // 输入框不存在时，使用默认值
    const v = decimalsEl ? parseInt(decimalsEl.value, 10) : DEFAULT_DECIMALS;
    return clamp(Number.isFinite(v) ? v : DEFAULT_DECIMALS, 0, 18);
  }
  function getSymbol(){
    const v = symbolEl ? (symbolEl.value || '').trim() : DEFAULT_SYMBOL;
    return v || DEFAULT_SYMBOL;
  }
  function showRaw(){
    return showRawEl ? !!showRawEl.checked : DEFAULT_SHOW_RAW;
  }

  function setBusy(b){
    startBtn.disabled = b;
    stopBtn.disabled = !b;
  }

  function updateAmountHeader(){
    let label = '总分配';
    if (sortAmountAsc === true) label += ' ▲';
    else if (sortAmountAsc === false) label += ' ▼';
    thAmount.textContent = label;
    thAmount.classList.add('sortable');
  }

  function safeBigInt(s){
    try{
      if (typeof s !== 'string') s = String(s ?? '0');
      if (!/^\d+$/.test(s)) return 0n;
      return BigInt(s);
    }catch{
      return 0n;
    }
  }

  function formatUnits(raw, decimals){
    raw = (typeof raw === 'bigint') ? raw : safeBigInt(raw);
    decimals = clamp(decimals|0, 0, 18);

    const neg = raw < 0n;
    const x = neg ? -raw : raw;

    if (decimals === 0) return (neg ? '-' : '') + x.toString();

    const base = 10n ** BigInt(decimals);
    const intPart = x / base;
    const fracPart = x % base;

    let frac = fracPart.toString().padStart(decimals, '0');
    frac = frac.replace(/0+$/,'');
    const out = frac.length ? `${intPart.toString()}.${frac}` : intPart.toString();
    return (neg ? '-' : '') + out;
  }

  function renderAmount(rawBig){
    if (showRaw()) return (typeof rawBig === 'bigint' ? rawBig : safeBigInt(rawBig)).toString();
    return formatUnits(rawBig, getDecimals());
  }

  function buildAllocTooltip(allocs){
    if (!Array.isArray(allocs) || allocs.length === 0) return '';
    const dec = getDecimals();
    const sym = getSymbol();
    return allocs.map(a=>{
      const raw = a.amountRaw ?? 0n;
      const f = formatUnits(raw, dec);
      return `${a.category || 'Unknown'}: ${showRaw() ? raw.toString() : (f + ' ' + sym)} (raw: ${raw.toString()})`;
    }).join('\n');
  }

  function setSummaryFromResults(){
    const total = results.length;
    const done = results.filter(r => r && r.status !== 'queued' && r.status !== 'running').length;
    const eligible = results.filter(r => r && r.eligible === true).length;

    let sumRaw = 0n;
    for (const r of results){
      if (r && r.eligible === true && typeof r.totalRaw === 'bigint') sumRaw += r.totalRaw;
    }

    summary.innerHTML =
      `输入地址数量 <b>${total}</b> 个 · 已完成 <b>${done}</b> 个 · 有资格 <b>${eligible}</b> 个 · 总分配 <b>${renderAmount(sumRaw)}</b> ${getSymbol()}`;
  }

  function addRow(idx, address){
    const tr = document.createElement('tr');

    const tdIdx = document.createElement('td');
    tdIdx.textContent = String(idx + 1);

    const tdAddr = document.createElement('td');
    tdAddr.className = 'addr';
    tdAddr.textContent = address;

    const tdAmt = document.createElement('td');
    tdAmt.className = 'num';
    tdAmt.textContent = '—';

    const tdStat = document.createElement('td');
    tdStat.className = 'status';
    tdStat.innerHTML = `<span class="dot warn">•</span><span> 排队中</span>`;

    tr.appendChild(tdIdx);
    tr.appendChild(tdAddr);
    tr.appendChild(tdAmt);
    tr.appendChild(tdStat);
    tbody.appendChild(tr);

    return {
      tr, idxCell: tdIdx, addrEl: tdAddr, amtEl: tdAmt, statEl: tdStat,
      setPending(){ this.statEl.innerHTML = `<span class="dot pending">…</span><span class="muted"> 查询中</span>`; },
      setOK(totalRaw, allocations){
        this.amtEl.classList.remove('num-err');
        this.amtEl.textContent = renderAmount(totalRaw);
        this.amtEl.title = buildAllocTooltip(allocations); // 功能保留
        this.statEl.innerHTML = `<span class="dot ok">✔</span><span> 有资格</span>`;
      },
      setNo(){
        this.amtEl.classList.remove('num-err');
        this.amtEl.textContent = renderAmount(0n);
        this.amtEl.title = '';
        this.statEl.innerHTML = `<span class="dot err">✖</span><span> 不符合资格</span>`;
      },
      setFail(msg='失败'){
        this.amtEl.classList.add('num-err');
        this.amtEl.textContent = renderAmount(0n);
        this.amtEl.title = msg || '';
        this.statEl.innerHTML = `<span class="dot err">✖</span><span class="text-err" title="${String(msg).replace(/"/g,'&quot;')}"> 失败</span>`;
      },
      setStop(){
        this.statEl.innerHTML = `<span class="dot err">✖</span><span class="text-err"> 已停止</span>`;
      }
    };
  }

  async function fetchOnce(identity, identityType, signal){
    const url = new URL(API_ENDPOINT, window.location.origin);
    url.searchParams.set('identity', identity);
    url.searchParams.set('identityType', identityType);

    const res = await fetch(url.toString(), {
      method:'GET',
      headers:{ 'accept':'application/json' },
      cache:'no-store',
      signal
    });

    const text = await res.text();

    const is1015 = text.includes('Error 1015') || text.includes('You are being rate limited');
    if (res.status === 429 || is1015) throw new Error(is1015 ? 'CF_1015' : 'HTTP_429');
    if (!res.ok) throw new Error(`HTTP_${res.status}`);

    let json;
    try{ json = JSON.parse(text); }
    catch{ throw new Error('JSON_PARSE_ERROR'); }

    const totalRaw = safeBigInt(json?.totalAmount ?? '0');
    const allocations = Array.isArray(json?.allocations)
      ? json.allocations.map(a => ({
          category: String(a?.category ?? ''),
          amountRaw: safeBigInt(a?.amount ?? '0')
        }))
      : [];

    return { eligible: totalRaw > 0n, totalRaw, allocations };
  }

  function updateExportButtons(){
    const anyDone = results.some(r => r && r.status !== 'queued');
    const anyOk = results.some(r => r && r.eligible === true);
    btnCsv.disabled = !anyDone;
    btnCopy.disabled = !anyOk;
  }

  function applyView(){
    const onlyOk = onlyOkEl.checked;

    let idxs = results.map((_,i)=> i);
    if (onlyOk) idxs = idxs.filter(i => results[i]?.eligible === true);

    if (sortAmountAsc !== null){
      idxs.sort((a,b)=>{
        const ra = results[a]?.totalRaw ?? 0n;
        const rb = results[b]?.totalRaw ?? 0n;
        return ra === rb ? 0 : (ra < rb ? -1 : 1);
      });
      if (sortAmountAsc === false) idxs.reverse();
    }

    rows.forEach(r => r.tr.style.display = 'none');
    idxs.forEach((i, orderIdx)=>{
      const r = rows[i];
      r.tr.style.display = '';
      r.idxCell.textContent = String(orderIdx + 1);
      tbody.appendChild(r.tr);
    });

    // ✅ 隐藏地址：表格地址隐藏
    rows.forEach(r => r.addrEl.classList.toggle('blur', hideAddrEl.checked));

    // ✅ 隐藏地址：输入框地址也隐藏（你提的需求）
    addrsEl.classList.toggle('blur', hideAddrEl.checked);

    // 重绘金额（仍保留逻辑，默认 decimals=9, symbol=FOGO, showRaw=false）
    for (let i=0;i<results.length;i++){
      const r = results[i];
      if (!r) continue;
      if (r.status === 'OK'){
        rows[i].amtEl.textContent = renderAmount(r.totalRaw);
        rows[i].amtEl.title = buildAllocTooltip(r.allocations);
      }else if (r.status === 'NO'){
        rows[i].amtEl.textContent = renderAmount(0n);
        rows[i].amtEl.title = '';
      }else if (r.status === 'FAIL' || r.status === 'STOP'){
        rows[i].amtEl.textContent = renderAmount(0n);
      }
    }

    updateExportButtons();
    updateAmountHeader();
    setSummaryFromResults();
  }

  function collectForExport(onlyOk){
    const dec = getDecimals();
    const sym = getSymbol();

    const out = results.map((r,i)=>{
      if (!r) return null;
      const alloc = Array.isArray(r.allocations) ? r.allocations : [];
      const allocSimple = alloc.map(a => ({
        category: a.category,
        amount_raw: (a.amountRaw ?? 0n).toString(),
        amount_fmt: formatUnits(a.amountRaw ?? 0n, dec)
      }));
      return {
        index: i + 1,
        address: r.address,
        identityType: r.identityType,
        eligible: !!r.eligible,
        status: r.status,
        total_raw: (r.totalRaw ?? 0n).toString(),
        total_fmt: formatUnits(r.totalRaw ?? 0n, dec),
        symbol: sym,
        allocations: JSON.stringify(allocSimple)
      };
    }).filter(Boolean);

    return onlyOk ? out.filter(x => x.eligible) : out;
  }

  function toCsv(rows){
    const headers = ['index','address','identityType','eligible','status','total_raw','total_fmt','symbol','allocations'];
    const esc = v => {
      v = (v == null) ? '' : String(v);
      return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
    };
    return [headers.join(','), ...rows.map(r => headers.map(h => esc(r[h])).join(','))].join('\n');
  }

  function chunkIndices(len, size){
    const out = [];
    for (let i=0;i<len;i+=size){
      const idxs = [];
      for (let k=0;k<size && (i+k)<len;k++) idxs.push(i+k);
      out.push(idxs);
    }
    return out;
  }

  async function runBatch(indices){
    const controllers = indices.map(()=> new AbortController());
    const onAbort = () => controllers.forEach(c => c.abort());
    aborter.signal.addEventListener('abort', onAbort, { once:true });

    indices.forEach(i => {
      rows[i].setPending();
      results[i].status = 'running';
    });

    const settled = await Promise.all(indices.map((i, k) =>
      fetchOnce(results[i].address, results[i].identityType, controllers[k].signal)
        .then(r => ({ ok:true, res:r, i }))
        .catch(e => ({ ok:false, err:e, i }))
    ));

    for (const s of settled){
      if (aborter.signal.aborted) continue;

      if (s.ok){
        if (s.res.eligible){
          rows[s.i].setOK(s.res.totalRaw, s.res.allocations);
          results[s.i] = { ...results[s.i], eligible:true, totalRaw:s.res.totalRaw, allocations:s.res.allocations, status:'OK' };
        }else{
          rows[s.i].setNo();
          results[s.i] = { ...results[s.i], eligible:false, totalRaw:0n, allocations:s.res.allocations, status:'NO' };
        }
      }else{
        rows[s.i].setFail(s.err?.message || '失败');
        results[s.i] = { ...results[s.i], eligible:false, totalRaw:0n, allocations:[], status:'FAIL' };
      }
    }

    applyView();
  }

  async function runAll(){
    const groups = chunkIndices(results.length, BATCH_SIZE);
    for (let g=0; g<groups.length; g++){
      if (aborter.signal.aborted) break;
      await runBatch(groups[g]); // ✅ 本批出结果后，立刻下一批
    }
  }

  function resetUI(){
    tbody.innerHTML = '';
    tableCard.style.display = 'none';
    rows = [];
    results = [];
    sortAmountAsc = null;
    updateAmountHeader();
    btnCsv.disabled = true;
    btnCopy.disabled = true;
    setSummaryFromResults();
  }

  // ===== 事件 =====
  startBtn.addEventListener('click', async ()=>{
    resetUI();

    const rawList = parseAddresses(addrsEl.value);

    const list = [];
    const seen = new Set();

    for (const raw of rawList){
      const hit = detectAndNormalize(raw);
      if (!hit) continue;

      const key = `${hit.identityType}:${hit.address}`;
      if (seen.has(key)) continue;
      seen.add(key);

      list.push(hit);
    }

    if (list.length === 0){
      alert('请粘贴至少一个有效地址（EVM 0x… 或 SVM Base58）');
      return;
    }

    tableCard.style.display = 'block';

    list.forEach((it, i)=>{
      rows.push(addRow(i, it.address));
      results.push({
        address: it.address,
        identityType: it.identityType,
        eligible: null,
        totalRaw: 0n,
        allocations: [],
        status: 'queued'
      });
    });

    applyView();

    aborter = new AbortController();
    setBusy(true);

    try{
      await runAll();
    }catch(e){
      if (e?.name !== 'AbortError') console.error(e);
    }finally{
      setBusy(false);
      applyView();
    }
  });

  stopBtn.addEventListener('click', ()=>{
    if (aborter) aborter.abort();

    for (let i=0;i<results.length;i++){
      const r = results[i];
      if (!r) continue;
      if (r.status === 'queued' || r.status === 'running'){
        rows[i].setStop();
        results[i].status = 'STOP';
      }
    }
    applyView();
  });

  onlyOkEl.addEventListener('change', applyView);
  hideAddrEl.addEventListener('change', applyView);

  thAmount.addEventListener('click', ()=>{
    sortAmountAsc = (sortAmountAsc === null) ? false : !sortAmountAsc;
    applyView();
  });

  btnCsv.addEventListener('click', ()=>{
    const data = collectForExport(exportOnlyOkEl.checked);
    if (data.length === 0) return;

    const csv = toCsv(data);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: 'fogo_allocations_results.csv'
    });
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });

  btnCopy.addEventListener('click', async ()=>{
    const okAddrs = results.filter(r => r && r.eligible === true).map(r => r.address);
    if (okAddrs.length === 0){
      alert('没有“有资格”的地址');
      return;
    }
    const sep = (sepSel.value === 'comma') ? ',' : '\n';
    const text = okAddrs.join(sep);

    try{
      await navigator.clipboard.writeText(text);
      alert(`已复制 ${okAddrs.length} 个有资格地址`);
    }catch{
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert(`已复制 ${okAddrs.length} 个有资格地址`);
    }
  });

  updateAmountHeader();

  // 默认塞两个示例（你可删）
  addrsEl.value =
    "\n" +
    "";
</script>
</body>
</html>
